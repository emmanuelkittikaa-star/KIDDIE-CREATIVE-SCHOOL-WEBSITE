        }

        label {

            margin-bottom: 8px;
            font-weight: bold;
            color: #2b2145;
        }

        input,

            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #c9bbeb;
            font-size: 1rem;
        }

        input:focus,
        select:focus {
            outline: 3px solid rgba(77, 45, 121, 0.12);
            border-color: #4d2d79;
        }

        button {
            background: #4d2d79;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #3e235d;
        }

        .questions {
            display: none;
            margin-top: 20px;
        }

        .questions.visible {
            display: block;
        }

        .question {
            margin-bottom: 24px;
            padding: 16px 18px;
            border: 1px solid #eae0ff;
            border-radius: 12px;
            background: #faf7ff;
        }

        .question h3 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 1.04rem;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 0;
            padding: 8px 10px;
            background: white;
            border: 1px solid #d9d3eb;
            border-radius: 8px;
            font-weight: normal;

            accent-color: #4d2d79;
        }

            display: none;
            margin-top: 24px;
            padding: 18px 20px;
            border-radius: 12px;
            background: #eef8ff;
            border: 1px solid #bdd9f0;
        }

        .result.show {
            display: block;
        }

        .result h2 {
            margin-top: 0;
            color: #214a6d;
        }

            display: inline-block;
            background: #25d366;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            text-align: center;

            font-size: 1rem;

            border-radius: 10px;

</head>

<body>
    <div class="container">
        <div class="exam-box">
            <a class="home-button" href="index.html">Back to Home</a>
            <h1>Student Placement Exam</h1>
            <p class="intro">Fill in the child’s details and choose the class to begin the assessment.</p>

            <div class="row">
                <div class="field">
                    <label for="studentName">Student Name</label>
                    <input id="studentName" type="text" placeholder="Enter student name">
                </div>
                <div class="field">
                    <label for="registrationNumber">Registration Number</label>
                    <input id="registrationNumber" type="text" placeholder="Auto-generated registration number"
                        readonly>
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label for="childClass">Child's Class</label>
                    <select id="childClass">
                        <option value="">-- Choose class --</option>
                        <option value="Daycare">Daycare</option>
                        <option value="Creche">Creche</option>
                        <option value="Kindergarten">Kindergarten</option>
                        <option value="Primary One">Primary One</option>
                        <option value="Primary Two">Primary Two</option>
                        <option value="Primary Three">Primary Three</option>
                        <option value="Primary Four">Primary Four</option>
                        <option value="Primary Five">Primary Five</option>
                        <option value="Primary Six">Primary Six</option>
                    </select>
                </div>
                <div class="field" style="min-width: 180px;">
                    <button id="loadExamBtn" type="button">Load Exam</button>
                </div>
            </div>

            <div id="timer" class="timer">Time Left: 10:00</div>

            <form id="examForm">
                <div id="questions" class="questions"></div>

                <div class="controls" style="margin-top: 20px; display: none;" id="submitArea">
                    <button type="submit">Submit Exam</button>
                </div>
            </form>

            <div id="resultBox" class="result">
                <h2>Exam Result</h2>
                <p id="resultText"></p>
                <div id="sendDetailsContainer" style="display: none; margin-top: 16px;">
                    <a id="sendDetailsBtn" class="whatsapp-button" href="#" target="_blank"
                        rel="noopener noreferrer">Send Details</a>
                </div>
            </div>
        </div>
    </div>

        function generateRegistrationNumber() {
            const year = new Date().getFullYear();
            const randomNumber = Math.floor(10000 + Math.random() * 90000);
            return 'KCS-' + year + '-' + randomNumber;
        }

        function ensureRegistrationNumber() {
            if (!registrationNumberInput.value.trim()) {
                registrationNumberInput.value = generateRegistrationNumber();
            }
            return registrationNumberInput.value.trim();
        }

        function generateVerificationCode() {
            const randomCode = Math.random().toString(36).slice(2, 8).toUpperCase();
            return 'KCS-' + randomCode;
        }

        function saveExamResult(studentName, registrationNumber, selectedClass, score, total, percentage, verificationCode) {
            const resultEntry = {
                studentName,
                registrationNumber,
                selectedClass,
                score,
                total,
                percentage: percentage.toFixed(0),
                verificationCode,
                date: new Date().toISOString()
            };

            try {
                const savedResults = JSON.parse(localStorage.getItem('kiddieExamResults') || '[]');
                savedResults.push(resultEntry);
                localStorage.setItem('kiddieExamResults', JSON.stringify(savedResults));
            } catch (error) {
                console.log('Local storage unavailable; results are shown only on screen.', error);
            }

            return verificationCode;
        }

        async function sendExamResultEmail(studentName, registrationNumber, selectedClass, score, total, percentage, status, verificationCode, submittedByTimer) {
            try {
                const response = await fetch('/api/send-exam-result', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    keepalive: true,
                    body: JSON.stringify({
                        studentName,
                        registrationNumber,
                        selectedClass,
                        score,
                        total,
                        percentage,
                        status,
                        verificationCode,
                        submittedByTimer
                    })
                });

                if (!response.ok) {
                    throw new Error('Email alert failed.');
                }
            } catch (error) {
                console.error('Exam result email was not sent:', error);
            }
        }

        function formatTime(totalSeconds) {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return minutes + ':' + String(seconds).padStart(2, '0');
        }

        function updateTimerDisplay(totalSeconds) {
            timerDisplay.textContent = 'Time Left: ' + formatTime(totalSeconds);
            timerDisplay.classList.toggle('warning', totalSeconds <= 60);
        }

        function stopTimer() {
            if (examTimer) {
                clearInterval(examTimer);
                examTimer = null;
            }
        }

        function disableExamInputs() {
            const inputs = examForm.querySelectorAll('input');
            inputs.forEach((input) => {
                input.disabled = true;
            });
            submitArea.style.display = 'none';
        }

        function finalizeExam(submittedByTimer = false) {
            const selectedClass = classSelect.value;
            const studentName = studentNameInput.value.trim();
            const registrationNumber = registrationNumberInput.value.trim();
            const items = questionBank[selectedClass] || [];
            let score = 0;

            items.forEach((item, index) => {
                const selectedAnswer = examForm.querySelector('input[name="q' + index + '"]:checked');

                if (selectedAnswer && selectedAnswer.value === item.answer) {
                    score += 1;
                }
            });

            const total = items.length;
            const percentage = total ? (score / total) * 100 : 0;
            const status = percentage >= 60 ? 'PASS' : 'FAIL';
            const isPass = percentage >= 60;
            const verificationCode = generateVerificationCode();

            stopTimer();
            disableExamInputs();
            sendDetailsContainer.style.display = 'none';
            sendDetailsBtn.href = '#';

            saveExamResult(studentName, registrationNumber, selectedClass, score, total, percentage, verificationCode);
            sendExamResultEmail(studentName, registrationNumber, selectedClass, score, total, percentage, status, verificationCode, submittedByTimer);

            resultBox.classList.add('show');
            resultText.innerHTML =
                '<strong>Student:</strong> ' + studentName + '<br>' +
                '<strong>Registration Number:</strong> ' + registrationNumber + '<br>' +
                '<strong>Class:</strong> ' + selectedClass + '<br>' +
                '<strong>Score:</strong> ' + score + ' / ' + total + ' (' + percentage.toFixed(0) + '%)<br>' +
                '<strong>Status:</strong> ' + status + '<br>' +
                '<strong>Verification Code:</strong> ' + verificationCode + '<br>' +
                (submittedByTimer
                    ? 'Time is up! The exam was auto-submitted and the email alert was triggered.'
                    : (isPass
                        ? 'The child is performing well for this class level. The email alert was triggered.'
                        : 'The child may need more support in this class level. The email alert was triggered.'));
        }

        function startTimer() {
            stopTimer();
            let timeLeft = examDurationSeconds;
            timerDisplay.style.display = 'block';
            updateTimerDisplay(timeLeft);

            const startTime = Date.now();
            examTimer = setInterval(() => {
                const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
                const remainingTime = examDurationSeconds - elapsedSeconds;

                if (remainingTime <= 0) {
                    updateTimerDisplay(0);
                    finalizeExam(true);
                    return;
                }

                updateTimerDisplay(remainingTime);
            }, 1000);
        }

        function buildQuestions(selectedClass) {
            const items = questionBank[selectedClass] || [];
            questionsDiv.innerHTML = '';
            resultBox.classList.remove('show');

            if (!items.length) {
                questionsDiv.classList.remove('visible');
                submitArea.style.display = 'none';
                timerDisplay.style.display = 'none';
                stopTimer();
                return;
            }

            items.forEach((item, index) => {
                const questionWrap = document.createElement('div');
                questionWrap.className = 'question';

                const questionTitle = document.createElement('h3');
                questionTitle.textContent = item.question;
                questionWrap.appendChild(questionTitle);

                const optionsWrap = document.createElement('div');
                optionsWrap.className = 'options';

                item.options.forEach((option) => {
                    const optionLabel = document.createElement('label');
                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = 'q' + index;
                    radio.value = option;

                    optionLabel.appendChild(radio);
                    optionLabel.appendChild(document.createTextNode(option));
                    optionsWrap.appendChild(optionLabel);
                });

                questionWrap.appendChild(optionsWrap);
                questionsDiv.appendChild(questionWrap);
            });

            questionsDiv.classList.add('visible');
            submitArea.style.display = 'block';
            startTimer();
        }

                return;

            registrationNumberInput.value = registrationNumber;
            resultBox.classList.remove('show');
            buildQuestions(selectedClass);

                '<strong>Student:</strong> ' + studentName + '<br>' +
                '<strong>Registration Number:</strong> ' + registrationNumber + '<br>' +
                '<strong>Class:</strong> ' + selectedClass + '<br>' +
                '<strong>Score:</strong> ' + score + ' / ' + total + ' (' + percentage.toFixed(0) + '%)<br>' +
                '<strong>Status:</strong> ' + status + '<br>' +
                '<strong>Verification Code:</strong> ' + verificationCode + '<br>' +
                (isPass
                    ? 'The child is performing well for this class level. The email alert was triggered.'
                    : 'The child may need more support in this class level. The email alert was triggered.');
        });
    </script>
</body>
